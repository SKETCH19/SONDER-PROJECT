<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Sonder</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="welcome-page">
    <div class="stars"></div>
    <div class="form-container">
        <div class="form-logo-container">
            <img src="logo.svg" alt="Sonder" class="form-logo">
            <h1 class="form-title">Sonder</h1>
        </div>
        
        <h2 style="text-align: center; color: var(--stardust); margin-bottom: 1.5rem; font-size: 1.2rem; opacity: 0.8;">Iniciar sesion</h2>
        <p style="text-align: center; opacity: 0.7; margin-bottom: 1rem;">Demo estatica. El backend no esta disponible en GitHub Pages.</p>
        
        <form data-demo-form>
            <div class="form-group">
                <label class="form-label">Usuario o correo electronico</label>
                <input type="text" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Contrasena</label>
                <input type="password" class="form-input" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar sesion</button>
        </form>
        
        <p style="text-align: center; margin-top: 1rem;">
            No tienes cuenta? <a href="register.html" style="color: var(--electric-blue);">Registrate</a>
        </p>
        <p style="text-align: center; margin-top: 0.8rem;">
            <a href="index.html" style="color: var(--electric-blue);">Volver al inicio</a>
        </p>
    </div>
    <script src="js/demo.js"></script>
</body>
</html>
